<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem GP</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;}
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="gasFrame" src=""></iframe>

    <script>
        // 1. Masukkan URL Web App GAS Anda HINGGA /exec (JANGAN tambahkan ?p=admin)
        const baseUrl = "https://script.google.com/macros/s/AKfycbxCf6_yy1oHB8I7cppAP82IT9SR0oW1iX76BxgIa153RpuDC03HkPXM3HiseAus_lOo/exec";

        // 2. Ambil parameter dari URL browser (misal ?p=admin)
        const urlParams = new URLSearchParams(window.location.search);
        
        // 3. Rakit kembali URL-nya
        let finalUrl = baseUrl;
        if(urlParams.toString()) {
            finalUrl += "?" + urlParams.toString();
        }

        // 4. Masukkan URL yang sudah dirakit ke dalam iframe
        document.getElementById("gasFrame").src = finalUrl;
    </script>
</body>
</html>
