<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem GP - DISDIKBUD</title>
    <style>
        /* Menggunakan 100dvh agar iframe tidak tertutup menu peramban HP */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100vh; /* Fallback untuk browser lama */
            height: 100dvh; /* Dynamic Viewport untuk HP modern */
            overflow: hidden;
            background-color: #f0f2f5;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }
    </style>
</head>
<body>
    <iframe id="gasFrame" src="" allow="fullscreen; clipboard-read; clipboard-write"></iframe>

    <script>
        // 1. Masukkan URL Web App GAS Anda HINGGA /exec (JANGAN tambahkan ?p=admin)
        const baseUrl = "https://script.google.com/macros/s/AKfycbwaXtQ9I_XI4oRWzYb9uPg5pzwe3jSzFu2Chp86w0QFsEJjcrjUC6Nl-r9cjF9k7mshyA/exec";

        // 2. Ambil parameter dari URL browser (misal ?p=admin)
        const urlParams = new URLSearchParams(window.location.search);
        
        // 3. Rakit kembali URL-nya
        let finalUrl = baseUrl;
        if(urlParams.toString()) {
            finalUrl += "?" + urlParams.toString();
        }

        // 4. Masukkan URL yang sudah dirakit ke dalam iframe
        document.getElementById("gasFrame").src = finalUrl;
    </script>
</body>
</html>
